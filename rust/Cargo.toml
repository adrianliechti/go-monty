[package]
name = "monty-go-wasm"
version = "0.0.23"
edition = "2024"
publish = false
description = "Core WebAssembly module driving a Monty protocol child one framed request per call (for go-monty)."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to the upstream monty commit this binding tracks (the checked-in
# internal/pb/monty.proto is copied from the same commit).
monty-proto = { git = "https://github.com/pydantic/monty", rev = "302e0f27ec8516689ba90793cd0381149e5f4076", features = ["worker"] }
monty-alloc = { git = "https://github.com/pydantic/monty", rev = "302e0f27ec8516689ba90793cd0381149e5f4076" }
monty-types = { git = "https://github.com/pydantic/monty", rev = "302e0f27ec8516689ba90793cd0381149e5f4076" }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
